<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/qf-new-logo-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/qf-new-logo-transparent.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Background of the login and sign-up screens: fetched in parallel with the app bundle. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/QuickFoodFondo.png" />
    <title>QuickFood - Gestion de Eventos</title>
    <script id="react-dotenv" src="./env.js"></script>
    <!-- Paint the theme background and the loader before the JS bundle arrives, so a full
         page load never shows a white screen. Same look as .qf-route-loading (Main.js). -->
    <script>
      (function () {
        var dark = true;
        try { dark = localStorage.getItem("modoOscuroActivo") !== "false"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <style>
      /* !important: Bootstrap's body { background-color: #fff } otherwise wins and flashes white. */
      html, body { margin: 0; background-color: var(--qf-bg-main, #1a1a1a) !important; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: var(--qf-bg-main, #f3f1ed) !important; }
      .qf-boot-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .qf-boot-loading img { width: min(180px, 45vw); height: auto; }
      .qf-boot-loading span { width: 2.75rem; height: 2.75rem; box-sizing: border-box; border: 4px solid rgba(255, 189, 89, 0.25); border-top-color: #ffbd59; border-radius: 50%; animation: qf-boot-spin 0.8s linear infinite; }
      @keyframes qf-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="qf-boot-loading" role="status" aria-label="Cargando"><img src="%PUBLIC_URL%/qf-new-logo-transparent.png" alt="" /><span></span></div></div>
  </body>
</html>
